[project]
name = "saved-map"
version = "0.2.1"
description = "Local library of your saved posts, pins and books: collections, semantic map, search"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.48",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=11",
    "numpy>=2",
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.50",
    "sentence-transformers>=3.3",
    "sentencepiece>=0.2",
    "faster-whisper>=1.1",
    "easyocr>=1.7",
    "umap-learn>=0.5.7",
    "scikit-learn>=1.5",
    "stop-words>=2018.7.23",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "gallery-dl>=1.32.19",
    "feedparser>=6.0.14",
    "yt-dlp>=2026.10.26",
    "tomlkit>=0.15.2",
]

[project.scripts]
savedmap = "savedmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["savedmap"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
